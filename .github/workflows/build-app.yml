name: build-app

# Every push and pull request packages the app for macOS and Windows so packaging breaks
# surface before a release. Pushing a version tag (v1.2.3) also publishes the zips as a
# GitHub release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Cache Electron Downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ runner.os }}-arm64-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-electron-

      - run: pnpm install --frozen-lockfile

      - name: Build macOS App
        env:
          # No signing identity is configured for CI; release zips are unsigned.
          CODOPHON_UNSIGNED_BUILD: '1'
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        run: pnpm make:mac

      - uses: actions/upload-artifact@v7
        with:
          name: codophon-darwin-arm64
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error

  build-windows:
    name: build-windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          architecture: ${{ matrix.arch }}
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Cache Electron Downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-

      - run: pnpm install --frozen-lockfile

      - name: Build Windows App
        shell: bash
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        run: |
          pnpm exec vp build
          pnpm exec electron-forge make --platform=win32 --arch=${{ matrix.arch }}

      - name: Verify Windows Runtime and Native Modules
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $process = Start-Process -Wait -PassThru -NoNewWindow `
            -FilePath ".\out\Codophon-win32-${{ matrix.arch }}\codophon.exe" `
            -ArgumentList '.\.github\scripts\verify-windows-package.cjs', `
              ".\out\Codophon-win32-${{ matrix.arch }}", '${{ matrix.arch }}'
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - uses: actions/upload-artifact@v7
        with:
          name: codophon-win32-${{ matrix.arch }}
          path: out/make/zip/win32/${{ matrix.arch }}/*.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Validate Release Version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag
          gh release upload "${GITHUB_REF_NAME}" assets/*.zip --clobber
